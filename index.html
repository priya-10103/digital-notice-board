<!DOCTYPE html>
<html>
<head>
    <title>Digital Notice Board Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
    <h2>📢 Digital Notice Board</h2>

    <div class="controls">
        <button onclick="toggleDark()">🌙</button>
        <button onclick="toggleAdmin()">🔐 Admin</button>
        <button onclick="toggleFullscreen()">🖥 TV Mode</button>
    </div>
</div>

<div class="container">

    <div id="adminPanel" class="hidden">
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="unlockAdmin()">Login</button>
    </div>

    <div id="app">

        <div id="counter"></div>

        <div class="input-box">
            <input type="text" id="noticeInput" placeholder="Enter notice...">
            <button onclick="addNotice()">Add</button>
        </div>

        <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchNotice()">

        <button onclick="clearAll()" class="danger">Clear All</button>

        <ul id="noticeList"></ul>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
