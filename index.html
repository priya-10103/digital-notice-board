<!DOCTYPE html>
<html>
<head>
    <title>Notice Board Pro X</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
    <div>📢 Notice Board Pro X</div>

    <div class="btns">
        <button onclick="toggleDark()">🌙</button>
        <button onclick="toggleAdmin()">🔐</button>
        <button onclick="toggleTV()">🖥</button>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminBox" class="hidden">
    <input type="password" id="pass" placeholder="Admin password">
    <button onclick="login()">Login</button>
</div>

<div class="container">

    <div id="counter"></div>

    <div class="inputRow">
        <input id="text" placeholder="Enter notice...">
        <button onclick="add()">Add</button>
    </div>

    <input id="search" placeholder="Search..." onkeyup="search()">

    <button class="danger" onclick="clearAll()">Clear All</button>

    <div id="list"></div>

</div>

<script src="script.js"></script>
</body>
</html>
